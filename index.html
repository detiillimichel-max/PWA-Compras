<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08131d">
  <meta name="description" content="PWA Compras — lojas e ofertas do ecossistema OIO.">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
  <title>Compras OIO</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <img src="./icon-192.png" alt="" class="brand-icon">
        <div>
          <h1>Compras OIO</h1>
          <p>Encontre lojas e ofertas em um só lugar</p>
        </div>
      </div>
    </header>

    <section class="hero">
      <div>
        <span class="eyebrow">🛍️ PWA COMPRAS</span>
        <h2>Onde você quer comprar?</h2>
        <p>Pesquise uma loja ou escolha uma categoria. Os catálogos serão adicionados por etapas.</p>
      </div>
      <label class="search">
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="Buscar loja..." autocomplete="off">
      </label>
    </section>

    <section class="section">
      <div class="section-heading">
        <h2>Lojas</h2>
        <span id="storeCount"></span>
      </div>
      <div id="storeGrid" class="store-grid" aria-live="polite"></div>
    </section>

    <section class="section">
      <div class="section-heading"><h2>Categorias</h2></div>
      <div id="categoryGrid" class="category-grid"></div>
    </section>

    <footer>
      <span>O catálogo será atualizado por etapas.</span>
      <span>Preparado para o Telégrafo.</span>
    </footer>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
